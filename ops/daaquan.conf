# ============================================================
# Gzip Compression Settings
# ============================================================
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/json
  application/javascript
  application/x-javascript
  application/xml
  application/xml+rss
  application/xhtml+xml
  application/x-font-ttf
  application/x-font-opentype
  application/vnd.ms-fontobject
  image/svg+xml
  image/x-icon;
gzip_disable "msie6";
gzip_min_length 256;

# ============================================================
# daaquan.com: personal homepage. Platform pages moved to kabukanban.com.
# `/` serves the static homepage. The machine endpoints stay because current
# builds and installed apps call them by absolute URL: /api, /ws, /quant
# (VITE_*_URL baked into the bundle) and /updates (desktop updater feed).
# Public edge: Cloudflare (HTTPS) -> this nginx (:80).
# ============================================================
server {
    listen 80;
    server_name daaquan.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # Quant API (Core - Python, port 8000)
    location /quant/ {
        proxy_pass http://10.100.0.11:8000/core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket (Gateway, port 9100)
    location /ws {
        proxy_pass http://10.100.0.11:9100/ws;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_set_header Sec-WebSocket-Protocol "";
    }

    # Stock Pool Pipeline SSE Stream (long timeout for pipeline scans)
    location /api/stock-pool/pipeline/stream {
        proxy_pass http://10.100.0.11:9100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Gateway REST API (Express, port 9100)
    location /api/ {
        proxy_pass http://10.100.0.11:9100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================================
    # Desktop auto-update feed (Tauri updater)
    # ============================================================
    # Served from tanuki directly, NOT proxied to cube: these are ~60 MB
    # installers and every client download would otherwise cross WireGuard.
    # scripts/sync-update-feed.sh (systemd timer on this host) writes the files.
    #
    # The updater fetches this from Rust, not the webview, so the app CSP does
    # not apply -- but an installer is only trusted after its minisign signature
    # verifies against the pubkey compiled into the app, so a tampered file here
    # cannot be installed.
    location /updates/ {
        alias /opt/platform-app/updates/;
        autoindex off;
        # The human-facing download page, published by sync-update-feed.sh
        # alongside the bundles. autoindex stays off -- this is a written page,
        # not a directory listing.
        index index.html;

        # The manifest must never be cached: a stale copy is indistinguishable
        # from "no update available". files.json and the page that reads it are
        # the same contract for humans -- a cached pair offers last release's
        # installers from a page that looks current.
        location ~ ^/updates/(latest\.json|files\.json|index\.html)$ {
            root /opt/platform-app;
            # `expires epoch` would emit a second Cache-Control: no-cache
            # alongside this one. Two headers that disagree in length is how an
            # intermediary ends up picking the weaker of them.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Installers are immutable -- the version is in the file name.
        location ~* ^/updates/.+\.(exe|msi|gz|dmg|deb|apk|AppImage|sig)$ {
            root /opt/platform-app;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }
    }

    # daaquan-locale-redirects
    location = / {
        return 302 /ja/;
    }
    rewrite ^/notes/?$ /ja/notes/ permanent;
    rewrite ^/notes/(.+)$ /ja/notes/$1 permanent;
    # /daaquan-locale-redirects

    location / {
        root /var/www/daaquan/current;
        error_page 404 /404.html;
        index index.html;
        charset utf-8;
        try_files $uri $uri/ =404;
        # Revalidate editable sample content after each deployment.
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
